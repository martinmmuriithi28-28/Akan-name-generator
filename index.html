<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<!--Website infomation-->

<body>

<div class="container">

<h1>Akan Name Generator</h1>

<p class="description">
                        Enter your birthday and gender to discover your traditional Akan name from Ghana.

</p>

<form id="akanform">

<!--Date of birth-->

<label for="day">Day</label>

<input type="number"
        id="day" 
        placeholder="Enter Day" 
        min="1"   
        max="31"
        required
                 >   

<label for="month">Month</label>

<input type="number"
        id="month"
        placeholder="Enter Month"
        min="1"
        max="12"
        required
                 >

<label for="year">Year</label>

<input type="number"
       id="year"
       placeholder="Enter Year"
       required
                >

<!--Gender-->

<h3>Select Gender</h3>

<label>

<input type="radio"name="gender"value="male">Male

</label>

<label>

<input type="radio"name="gender"value="female">female

</label>

<br><br>

<!--Button-->

<button type="submit">
                       Generate Akan Name

</button>

</form>

<!--Result Section-->

<div id="result"></div>

</div>

<!--Javascirpt-->

<script src="script.js"></script>

</body>
</html>
